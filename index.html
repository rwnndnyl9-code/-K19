<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta name="google-site-verification" content="הקוד_שלך_מגוגל" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חדשות K19 - המערכת הרשמית</title>
    <!-- תג אימות Google Search Console במידת הצורך -->
    
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #12161f;
            --primary-red: #e50914;
            --gold-accent: #ffcc00;
            --text-bright: #ffffff;
            --text-muted: #9fa6b2;
            --border-color: #212631;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-bright);
            direction: rtl;
            padding-bottom: 40px;
        }

        /* סרגל מבזקים רץ */
        .ticker-wrap {
            width: 100%;
            background-color: var(--primary-red);
            color: white;
            overflow: hidden;
            height: 35px;
            line-height: 35px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .ticker-title {
            background-color: #000;
            padding: 0 15px;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            color: var(--gold-accent);
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 25s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(100%, 0, 0); }
